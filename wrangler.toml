name = "webflow-markdown-agent"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
account_id = "a18fc5f89c6152971287198a8c920d1a"

# Website hosts only. A wildcard (*infinitecompute.ai/*) also matched the console,
# API and docs subdomains, so every console request ran through this worker and
# got its security headers twice (INF-373, 2026-11-19).
routes = [
  { pattern = "infinitecompute.ai/*", zone_name = "infinitecompute.ai" },
  { pattern = "www.infinitecompute.ai/*", zone_name = "infinitecompute.ai" }
]
